name: Epic
description: Größeres Vorhaben (z. B. Relaunch, neue App) – bündelt Spec und Feature-Issues.
title: "[Epic] "
labels: ["epic", "needs-spec"]
body:
  - type: textarea
    id: ziel
    attributes:
      label: Ziel
      description: Warum wird das gemacht? Welches Problem wird für wen gelöst?
    validations:
      required: true
  - type: textarea
    id: erfolg
    attributes:
      label: Erfolgsmessung
      description: Woran erkennen wir nach Go-Live, dass es funktioniert? Messbar formulieren.
      placeholder: "- Conversion mobil mindestens auf Vorniveau\n- Keine 404 für die Top-500-URLs"
    validations:
      required: true
  - type: textarea
    id: umfang
    attributes:
      label: Umfang
      value: "**Enthalten**\n- \n\n**Nicht enthalten**\n- "
    validations:
      required: true
  - type: textarea
    id: rahmen
    attributes:
      label: Rahmenbedingungen
      description: Termin, Budget, Go-Live-Fenster, Abnahme durch, Inhalte geliefert von.
  - type: input
    id: spec
    attributes:
      label: Spec-Datei
      description: Pfad zur Spec-Datei im Repo. Sie bleibt die Quelle.
      placeholder: docs/specs/<thema>.md
  - type: textarea
    id: spec_text
    attributes:
      label: Spec (vollständig)
      description: Nach der Freigabe den vollständigen Spec-Text (Abschnitte 1–10) aus der Spec-Datei hier einfügen und die Version nennen. Das Epic ist die sichtbare Kopie; die Datei bleibt die Quelle. Bei einer neuen Version den Text hier aktualisieren.
      placeholder: "Version: 1.0\n\n## 1. Ziel\n…\n\n## 2. Erfolg\n…"
  - type: textarea
    id: issues
    attributes:
      label: Zugehörige Issues
      description: Wird nach Freigabe der Spec befüllt (Sub-Issues oder Liste).
  - type: input
    id: kundenfassung
    attributes:
      label: Kundenfassung (Gist)
      description: Link zum secret Gist der Kundenfassung, mit Stand und Version. Kein public Gist; bei vertraulichen Inhalten PDF/Mail oder Confluence.
      placeholder: "https://gist.github.com/… · Stand 2026-11-11 · v1.0"
  - type: textarea
    id: freigabe
    attributes:
      label: Freigabe
      description: Freigabe per Mail oder Gist-Kommentar (Confluence optional, nur wenn der Kunde es nutzt), nicht hier im Issue. Beleg eintragen.
      value: "- Freigegeben von: \n- Datum: \n- Version: \n- Beleg (Mail-Datum mit Link, Gist-Kommentar oder Confluence-Link): "
